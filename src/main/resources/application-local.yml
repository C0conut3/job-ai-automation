# 无 MySQL 时本地快速启动：mvn spring-boot:run "-Dspring-boot.run.profiles=local"
# 本 profile 会预置演示管理员：用户名 admin，密码 admin123（含 ADMIN/RECRUITER/SEEKER 三种角色）及示例职位类别。
spring:
  datasource:
    url: jdbc:h2:mem:jobai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
