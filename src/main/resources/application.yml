# 默认连接本机 MySQL（localhost:3306 / 库名 job_ai）。
# 若报错 Communications link failure / Connection refused：说明当前连不上 MySQL（服务未启动、端口不对或防火墙）。
# 处理：启动 MySQL 并执行 CREATE DATABASE job_ai; 且用户名密码与下方一致；或改用内存库 profile：local（见 application-local.yml）。
spring:
  application:
    name: job-ai-automation
  datasource:
    url: jdbc:mysql://localhost:3306/job_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  ai:
    dashscope:
      api-key: #your dashscope api key
      chat:
        options:
          model: qwen-plus
    mcp:
      client:
        enabled: false

server:
  port: 8080

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# AI 模型配置（各Agent独立配置）
ai:
  openai:
    model.parse: qwen-plus
    model.optimize: qwen-plus
    model.user-agent: qwen-max
    model.preference-agent: deepseek-v3
    model.advice-agent: qwen-plus
    model.common-agent: qwen-plus