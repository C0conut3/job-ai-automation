server:
  port: 8081

spring:
  application:
    name: jobai-mcp-server
  datasource:
    url: jdbc:h2:mem:mcpserver;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  ai:
    mcp:
      server:
        enabled: true
        name: jobai-mcp-server
        version: 1.0.0
        port: 8081

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.springframework.ai.mcp: DEBUG
    com.jobai.automation.mcp: DEBUG
