<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM监控仪表盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #8892b0;
            font-size: 1.1rem;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.up {
            background: #00ff88;
            box-shadow: 0 0 20px #00ff88;
        }

        .status-dot.down {
            background: #ff4757;
            box-shadow: 0 0 20px #ff4757;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 217, 255, 0.2);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #8892b0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #00d9ff;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 700;
            color: #00d9ff;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #8892b0;
            font-size: 0.9rem;
        }

        .model-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .model-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .model-name {
            font-weight: 600;
            color: #00ff88;
        }

        .model-calls {
            background: rgba(0, 217, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #00d9ff;
        }

        .model-tokens {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .token-item {
            display: flex;
            flex-direction: column;
        }

        .token-label {
            color: #8892b0;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .token-value {
            color: #fff;
        }

        .health-section {
            grid-column: span 2;
        }

        .health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .health-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .health-status {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .health-status.up {
            color: #00ff88;
        }

        .health-status.down {
            color: #ff4757;
        }

        .health-label {
            color: #8892b0;
            font-size: 0.9rem;
        }

        .health-detail {
            font-size: 0.85rem;
            color: #8892b0;
            margin-top: 5px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
        }

        .btn-refresh {
            background: linear-gradient(135deg, #00d9ff, #00b4cc);
            color: #1a1a2e;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 217, 255, 0.4);
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #8892b0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 217, 255, 0.2);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stat-value {
                font-size: 2rem;
            }

            .health-section {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LLM监控仪表盘</h1>
            <p>实时监控LLM调用指标与服务健康状态</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="llmStatus"></div>
                <span id="llmStatusText">加载中...</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="dbStatus"></div>
                <span id="dbStatusText">加载中...</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="appStatus"></div>
                <span id="appStatusText">加载中...</span>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-title">
                    <span>📊</span>
                    <span>总调用次数</span>
                </div>
                <div class="stat-value" id="totalCalls">-</div>
                <div class="stat-label">Total LLM Calls</div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>📥</span>
                    <span>输入Token</span>
                </div>
                <div class="stat-value" id="totalInput">-</div>
                <div class="stat-label">Input Tokens</div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>📤</span>
                    <span>输出Token</span>
                </div>
                <div class="stat-value" id="totalOutput">-</div>
                <div class="stat-label">Output Tokens</div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>💰</span>
                    <span>估算成本</span>
                </div>
                <div class="stat-value" id="estimatedCost">¥0.00</div>
                <div class="stat-label">Estimated Cost (CNY)</div>
            </div>

            <div class="card" style="grid-column: span 2;">
                <div class="card-title">
                    <span>🤖</span>
                    <span>各模型调用统计</span>
                </div>
                <div class="model-list" id="modelList">
                    <div class="loading">
                        <div class="spinner"></div>
                        加载中...
                    </div>
                </div>
            </div>

            <div class="card health-section">
                <div class="card-title">
                    <span>🏥</span>
                    <span>服务健康检查</span>
                </div>
                <div class="health-grid" id="healthGrid">
                    <div class="loading">
                        <div class="spinner"></div>
                        加载中...
                    </div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-refresh" onclick="loadData()">
                🔄 刷新数据
            </button>
            <button class="btn btn-danger" onclick="resetMetrics()">
                🗑️ 重置统计
            </button>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                // 加载LLM指标
                const metricsResponse = await fetch('/api/metrics/llm');
                const metrics = await metricsResponse.json();
                updateMetrics(metrics);

                // 加载健康状态
                const healthResponse = await fetch('/actuator/health');
                const health = await healthResponse.json();
                updateHealth(health);
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        function updateMetrics(data) {
            document.getElementById('totalCalls').textContent = formatNumber(data.totalCalls || 0);
            document.getElementById('totalInput').textContent = formatNumber(data.totalInputTokens || 0);
            document.getElementById('totalOutput').textContent = formatNumber(data.totalOutputTokens || 0);
            document.getElementById('estimatedCost').textContent = '¥' + (data.estimatedCost || '0.00');

            const modelList = document.getElementById('modelList');
            const modelCallCount = data.modelCallCount || {};
            const modelInputTokens = data.modelInputTokens || {};
            const modelOutputTokens = data.modelOutputTokens || {};

            const models = Object.keys(modelCallCount);
            if (models.length === 0) {
                modelList.innerHTML = '<div style="text-align: center; color: #8892b0; padding: 20px;">暂无数据</div>';
                return;
            }

            modelList.innerHTML = models.map(model => `
                <div class="model-item">
                    <div class="model-header">
                        <span class="model-name">${model}</span>
                        <span class="model-calls">${modelCallCount[model]} 次调用</span>
                    </div>
                    <div class="model-tokens">
                        <div class="token-item">
                            <span class="token-label">输入Token</span>
                            <span class="token-value">${formatNumber(modelInputTokens[model] || 0)}</span>
                        </div>
                        <div class="token-item">
                            <span class="token-label">输出Token</span>
                            <span class="token-value">${formatNumber(modelOutputTokens[model] || 0)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateHealth(data) {
            const llmStatus = document.getElementById('llmStatus');
            const llmStatusText = document.getElementById('llmStatusText');
            const dbStatus = document.getElementById('dbStatus');
            const dbStatusText = document.getElementById('dbStatusText');
            const appStatus = document.getElementById('appStatus');
            const appStatusText = document.getElementById('appStatusText');

            // 解析健康状态
            const llmHealth = data.components?.llm?.status || 'UNKNOWN';
            const dbHealth = data.components?.db?.status || 'UNKNOWN';
            const overallHealth = data.status || 'UNKNOWN';

            // 更新状态指示器
            updateStatusIndicator(llmStatus, llmStatusText, llmHealth, 'LLM服务');
            updateStatusIndicator(dbStatus, dbStatusText, dbHealth, '数据库');
            updateStatusIndicator(appStatus, appStatusText, overallHealth, '应用服务');

            // 更新健康网格
            const healthGrid = document.getElementById('healthGrid');
            healthGrid.innerHTML = `
                <div class="health-item">
                    <div class="health-status ${llmHealth.toLowerCase()}">${getStatusIcon(llmHealth)}</div>
                    <div class="health-label">LLM服务</div>
                    <div class="health-detail">${data.components?.llm?.details?.message || '-'}</div>
                </div>
                <div class="health-item">
                    <div class="health-status ${dbHealth.toLowerCase()}">${getStatusIcon(dbHealth)}</div>
                    <div class="health-label">数据库</div>
                    <div class="health-detail">${data.components?.db?.details?.database || '-'}</div>
                </div>
                <div class="health-item">
                    <div class="health-status ${overallHealth.toLowerCase()}">${getStatusIcon(overallHealth)}</div>
                    <div class="health-label">整体状态</div>
                    <div class="health-detail">${data.status === 'UP' ? '所有服务正常' : '部分服务异常'}</div>
                </div>
            `;
        }

        function updateStatusIndicator(elem, textElem, status, label) {
            elem.className = 'status-dot ' + (status === 'UP' ? 'up' : 'down');
            textElem.textContent = label + ': ' + (status === 'UP' ? '正常' : '异常');
        }

        function getStatusIcon(status) {
            return status === 'UP' ? '✅' : '❌';
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        async function resetMetrics() {
            if (!confirm('确定要重置所有统计数据吗？此操作不可撤销。')) {
                return;
            }

            try {
                const response = await fetch('/api/metrics/llm/reset', {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.status === 'success') {
                    loadData();
                    alert('统计数据已重置');
                }
            } catch (error) {
                console.error('重置失败:', error);
                alert('重置失败，请重试');
            }
        }

        // 页面加载时自动加载数据
        document.addEventListener('DOMContentLoaded', loadData);

        // 每30秒自动刷新
        setInterval(loadData, 30000);
    </script>
</body>
</html>
