<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 助手</title>
  <style>
    :root{--bg:#0f1419;--card:#1a2332;--text:#e6edf3;--muted:#8b9cb3;--accent:#58a6ff;--danger:#f85149;--border:#30363d}
    *{box-sizing:border-box}
    body{margin:0;height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    #app-content{display:flex;height:100vh;width:100%}
    .sidebar{width:300px;border-right:1px solid var(--border);background:#161b22;overflow-y:auto;padding:0.75rem;display:flex;flex-direction:column}
    .sidebar .header{flex-shrink:0}
    .sidebar .sessions{flex:1;overflow-y:auto;margin-top:0.5rem}
    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .header{padding:1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .new-btn{background:var(--accent);color:#0f1419;border:none;padding:0.45rem 0.9rem;border-radius:6px;cursor:pointer}
    .back-btn{background:transparent;color:var(--text);border:1px solid var(--border);padding:0.45rem 0.9rem;border-radius:6px;cursor:pointer;margin-right:0.5rem}
    .back-btn:hover{background:var(--card)}
    .sessions{margin-top:0.5rem}
    .session-item{padding:0.75rem;border-radius:8px;margin-bottom:0.5rem;background:transparent;border:1px solid transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    .session-item.active{background:var(--card);border-color:var(--border)}
    .session-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .session-item .delete-btn{background:transparent;border:none;color:var(--danger);cursor:pointer;padding:0.25rem 0.5rem;border-radius:4px;opacity:0;transition:opacity 0.2s}
    .session-item:hover .delete-btn{opacity:1}
    .session-item .delete-btn:hover{background:rgba(248,81,73,0.1)}
    .chat{flex:1;display:flex;flex-direction:column;min-height:0}
    .messages{flex:1;padding:1rem;overflow-y:auto;max-height:calc(100vh - 180px)}
    .msg{max-width:70%;padding:0.8rem;border-radius:10px;margin-bottom:0.75rem;white-space:pre-wrap}
    .msg.user{margin-left:auto;background:var(--accent);color:#0f1419}
    .msg.bot{margin-right:auto;background:var(--card);border:1px solid var(--border)}
    .msg.bot.thinking{color:var(--muted)}
    .thinking-dots{display:inline-flex;align-items:center}
    .thinking-dots .dot{animation:dotPulse 1.4s infinite ease-in-out}
    .thinking-dots .dot:nth-child(2){animation-delay:0.2s}
    .thinking-dots .dot:nth-child(3){animation-delay:0.4s}
    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .job-list{margin-top:0.5rem;border-top:1px solid var(--border);padding-top:0.5rem}
    .job-item{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:0.75rem;margin-bottom:0.5rem;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer}
    .job-item:hover{border-color:var(--accent)}
    .job-item .job-info{flex:1;min-width:0}
    .job-item .job-title{font-weight:600;color:var(--accent);margin-bottom:0.25rem}
    .job-item .job-company{font-size:0.85rem;color:var(--muted)}
    .job-item .job-category{font-size:0.75rem;background:var(--card);padding:0.15rem 0.4rem;border-radius:4px;display:inline-block;margin:0.25rem 0}
    .job-item .job-desc{font-size:0.85rem;color:var(--text);margin-top:0.25rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .job-item .job-actions{display:flex;flex-direction:column;gap:0.3rem;margin-left:0.75rem}
    .job-item .apply-btn{background:var(--accent);color:#0f1419;border:none;padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer;font-size:0.85rem;white-space:nowrap}
    .job-item .apply-btn:hover{opacity:0.9}
    .job-item .apply-btn:disabled{background:var(--muted);cursor:not-allowed}
    
    /* Modal styles */
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:1000;display:none}
    .modal-overlay.active{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto}
    .modal-header{padding:1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .modal-header h2{margin:0;color:var(--accent)}
    .modal-close{background:transparent;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;padding:0 0.5rem}
    .modal-close:hover{color:var(--text)}
    .modal-body{padding:1rem}
    .modal-body .detail-row{margin-bottom:0.75rem}
    .modal-body .detail-label{font-size:0.85rem;color:var(--muted);margin-bottom:0.25rem}
    .modal-body .detail-value{color:var(--text)}
    .modal-body .detail-desc{white-space:pre-wrap;color:var(--text)}
    .modal-footer{padding:1rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:0.5rem}
    .modal-footer .modal-apply-btn{background:var(--accent);color:#0f1419;border:none;padding:0.5rem 1.2rem;border-radius:6px;cursor:pointer}
    .modal-footer .modal-apply-btn:hover{opacity:0.9}
    .modal-footer .modal-cancel-btn{background:transparent;color:var(--text);border:1px solid var(--border);padding:0.5rem 1.2rem;border-radius:6px;cursor:pointer}
    .modal-footer .modal-cancel-btn:hover{background:var(--border)}
    .input-area{padding:0.75rem;border-top:1px solid var(--border);display:flex;gap:0.5rem;background:#161b22}
    .input-area textarea{flex:1;padding:0.6rem;border-radius:8px;border:1px solid var(--border);background:#0d1117;color:var(--text);resize:none}
    .send-btn{background:var(--accent);color:#0f1419;border:none;padding:0.5rem 1rem;border-radius:8px;cursor:pointer}
    .meta{font-size:0.85rem;color:var(--muted)}
    
    /* Empty state styles */
    .empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted)}
    .empty-icon{font-size:4rem;margin-bottom:1rem;color:var(--accent)}
    .empty-state h3{color:var(--text);margin:0 0 0.5rem 0}
    .empty-state p{margin:0 0 1.5rem 0}
    .empty-new-btn{background:var(--accent);color:#0f1419;border:none;padding:0.6rem 1.5rem;border-radius:8px;cursor:pointer;font-size:1rem}
    .empty-new-btn:hover{opacity:0.9}
    
    /* Login required screen */
    .login-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2000}
    .login-screen h1{color:var(--accent);margin-bottom:1rem}
    .login-screen p{color:var(--muted);margin-bottom:2rem}
    .login-screen .login-btn{background:var(--accent);color:#0f1419;border:none;padding:0.75rem 2rem;border-radius:8px;cursor:pointer;font-size:1rem}
    .login-screen .login-btn:hover{opacity:0.9}
  </style>
</head>
<body>
  <!-- Login required screen -->
  <div id="login-screen" class="login-screen" style="display:none">
    <h1>请先登录</h1>
    <p>使用 AI 助手功能需要先登录账号</p>
    <button class="login-btn" onclick="location.href='login.html'">去登录</button>
  </div>

  <div id="app-content" style="display:none">
    <div class="sidebar">
      <div class="header">
        <div><strong>AI 助手</strong><div class="meta">对话历史</div></div>
        <div>
          <button id="btn-back" class="back-btn" onclick="location.href='index.html'">返回首页</button>
          <button id="btn-new" class="new-btn">新建</button>
        </div>
      </div>
      <div class="sessions" id="sessions"></div>
    </div>
    <div class="main">
      <div class="header"><div><strong id="session-title">未选择对话</strong></div><div class="meta" id="session-meta"></div></div>
      <div class="chat">
        <div class="messages" id="messages"></div>
        <div id="empty-state" class="empty-state" style="display:none">
          <div class="empty-icon">🤖</div>
          <h3>开始对话</h3>
          <p>选择一个对话或创建新对话开始与 AI 助手交流</p>
          <button class="empty-new-btn" onclick="createNewSession()">新建对话</button>
        </div>
        <div class="input-area">
          <textarea id="input" rows="2" placeholder="向 AI 提问，例如：帮我推荐前端岗位或评估我的匹配度..."></textarea>
          <button id="send" class="send-btn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Job Detail Modal -->
  <div id="job-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">岗位详情</h2>
        <button class="modal-close" onclick="closeJobModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Job details will be loaded here -->
      </div>
      <div class="modal-footer">
        <button class="modal-cancel-btn" onclick="closeJobModal()">取消</button>
        <button class="modal-apply-btn" id="modal-apply-btn" onclick="applyFromModal()">投递</button>
      </div>
    </div>
  </div>

  <script>
    const sessionsEl = document.getElementById('sessions');
    const btnNew = document.getElementById('btn-new');
    const messagesEl = document.getElementById('messages');
    const sendBtn = document.getElementById('send');
    const inputEl = document.getElementById('input');
    const sessionTitle = document.getElementById('session-title');
    const sessionMeta = document.getElementById('session-meta');
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const emptyState = document.getElementById('empty-state');
    
    // Modal elements
    const jobModal = document.getElementById('job-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalApplyBtn = document.getElementById('modal-apply-btn');
    
    let sessions = [];
    let currentId = null;
    let currentJobId = null;
    let isLoggedIn = false;

    async function checkLoginStatus() {
      try {
        const res = await fetch('/api/v1/agent/chat/sessions', {
          method: 'GET',
          credentials: 'include'
        });
        if (res.ok) {
          isLoggedIn = true;
          appContent.style.display = 'flex';
          await loadSessions();
        } else {
          loginScreen.style.display = 'flex';
        }
      } catch (e) {
        loginScreen.style.display = 'flex';
      }
    }

    async function loadSessions() {
      try {
        const res = await fetch('/api/v1/agent/chat/sessions', {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
          sessions = data.data || [];
          renderSessions();
          if (sessions.length > 0) {
            openSession(sessions[0].id);
          } else {
            showEmptyState();
          }
        }
      } catch (e) {
        console.error('Failed to load sessions:', e);
      }
    }

    function showEmptyState() {
      messagesEl.style.display = 'none';
      emptyState.style.display = 'block';
      sessionTitle.textContent = 'AI 助手';
      sessionMeta.textContent = '';
    }

    function getSessionDisplayTitle(s) {
      return s.title ? (s.title.length > 10 ? s.title.substring(0, 10) + '...' : s.title) : '新对话';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleString('zh-CN');
    }

    function renderSessions() {
      sessionsEl.innerHTML = '';
      sessions.forEach(s => {
        const d = document.createElement('div');
        d.className = 'session-item' + (s.id === currentId ? ' active' : '');
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.textContent = getSessionDisplayTitle(s);
        d.appendChild(titleSpan);
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.title = '删除对话';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteSession(s.id);
        };
        d.appendChild(deleteBtn);
        
        d.onclick = () => { openSession(s.id); };
        sessionsEl.appendChild(d);
      });
    }

    async function deleteSession(id) {
      if (!confirm('确定要删除这个对话吗？')) return;
      try {
        const res = await fetch('/api/v1/agent/chat/sessions/' + id, {
          method: 'DELETE',
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
          sessions = sessions.filter(s => s.id !== id);
          if (currentId === id) {
            currentId = null;
            messagesEl.innerHTML = '';
            sessionTitle.textContent = '未选择对话';
            sessionMeta.textContent = '';
          }
          renderSessions();
          if (sessions.length === 0) {
            showEmptyState();
          } else if (currentId === null) {
            openSession(sessions[0].id);
          }
        } else {
          alert('删除失败: ' + (data.message || '未知错误'));
        }
      } catch (e) {
        alert('删除失败: ' + e.message);
      }
    }

    async function openSession(id) {
      currentId = id;
      emptyState.style.display = 'none';
      messagesEl.style.display = 'block';
      try {
        const res = await fetch('/api/v1/agent/chat/sessions/' + id, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success && data.data) {
          const session = data.data;
          sessionTitle.textContent = getSessionDisplayTitle(session);
          sessionMeta.textContent = session.createdAt ? '创建: ' + formatDate(session.createdAt) : '';
          messagesEl.innerHTML = '';
          (session.messages || []).forEach(m => appendMessageToView(m));
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } catch (e) {
        console.error('Failed to open session:', e);
      }
      renderSessions();
    }

    function createNewSession() {
      currentId = null;
      emptyState.style.display = 'none';
      messagesEl.style.display = 'block';
      messagesEl.innerHTML = '';
      sessionTitle.textContent = '新对话';
      sessionMeta.textContent = '';
      renderSessions();
    }

    async function sendMessage() {
      const content = inputEl.value.trim();
      if (!content || !isLoggedIn) return;
      
      sendBtn.disabled = true;
      inputEl.disabled = true;
      
      // 立即显示用户消息
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'msg user';
      userMsgDiv.innerHTML = renderMarkdown(content);
      messagesEl.appendChild(userMsgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      
      // 显示"思考中......"加载状态
      const thinkingDiv = document.createElement('div');
      thinkingDiv.className = 'msg bot thinking';
      thinkingDiv.innerHTML = '<span class="thinking-dots">思考中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>';
      messagesEl.appendChild(thinkingDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      const thinkingIndex = messagesEl.children.length - 1;
      
      try {
        if (!currentId) {
          const res = await fetch('/api/v1/agent/chat/sessions', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: content })
          });
          const data = await res.json();
          if (data.success) {
            await loadSessions();
            const newSession = sessions.find(s => s.title && s.title.startsWith(content.substring(0, 20)));
            if (newSession) {
              currentId = newSession.id;
              await openSession(currentId);
            }
          }
        } else {
          const res = await fetch('/api/v1/agent/chat/sessions/' + currentId + '/messages', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: content })
          });
          const data = await res.json();
          if (data.success) {
            await openSession(currentId);
          }
        }
      } catch (e) {
        // 替换思考中为错误消息
        if (messagesEl.children[thinkingIndex]) {
          messagesEl.children[thinkingIndex].innerHTML = renderMarkdown('❌ 发送失败: ' + e.message);
          messagesEl.children[thinkingIndex].classList.remove('thinking');
        }
      } finally {
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.value = '';
      }
    }

    function appendMessageToView(msg) {
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.role === 'user' ? 'user' : 'bot');
      div.innerHTML = renderMarkdown(msg.content);
      messagesEl.appendChild(div);
      if (msg.jobs && msg.jobs.length > 0) {
        const listDiv = document.createElement('div');
        listDiv.className = 'job-list';
        const header = document.createElement('div');
        header.style.cssText = 'font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem';
        header.textContent = '推荐岗位（共' + msg.jobs.length + '个）：';
        listDiv.appendChild(header);
        msg.jobs.forEach(job => {
          const item = document.createElement('div');
          item.className = 'job-item';
          item.innerHTML = '<div class="job-info">' +
                          '<div class="job-title">' + escapeHtml(job.title || '') + '</div>' +
                          '<div class="job-company">' + escapeHtml(job.company || '') + '</div>' +
                          '<div class="job-category">' + escapeHtml(job.category || '') + '</div>' +
                          '<div class="job-desc">' + escapeHtml(job.requirements || '') + '</div>' +
                          '</div>' +
                          '<div class="job-actions">' +
                          '<button class="apply-btn" onclick="applyJob(' + job.id + ', event)">投递</button>' +
                          '</div>';
          item.addEventListener('click', () => {
            openJobDetail(job.id);
          });
          listDiv.appendChild(item);
        });
        div.appendChild(listDiv);
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      // Headers
      html = html.replace(/^### (.+)$/gm, '<h4 style="margin:0.5rem 0;color:var(--accent)">$1</h4>');
      html = html.replace(/^## (.+)$/gm, '<h3 style="margin:0.75rem 0 0.25rem 0;color:var(--accent)">$1</h3>');
      html = html.replace(/^# (.+)$/gm, '<h2 style="margin:1rem 0 0.5rem 0;color:var(--accent)">$1</h2>');
      // Bold and italic
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      // Lists
      html = html.replace(/^\d+\. (.+)$/gm, '<li style="margin-left:1.5rem">$1</li>');
      html = html.replace(/^- (.+)$/gm, '<li style="margin-left:1.5rem">$1</li>');
      // Line breaks
      html = html.replace(/\n\n/g, '</p><p style="margin:0.5rem 0">');
      html = html.replace(/\n/g, '<br>');
      // Wrap in paragraph
      html = html.replace(/<p style="margin:0.5rem 0"><\/p>/g, '');
      if (!html.startsWith('<p')) {
        html = '<p style="margin:0.5rem 0">' + html + '</p>';
      }
      return html;
    }

    async function applyJob(jobId, event) {
      event.stopPropagation();
      const btn = event.target;
      const originalText = btn.textContent;
      btn.textContent = '投递中...';
      btn.disabled = true;
      
      try {
        const res = await fetch('/api/v1/seeker/jobs/' + jobId + '/apply', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (data.success) {
          btn.textContent = '已投递';
          btn.style.background = '#238636';
        } else {
          alert('投递失败: ' + (data.message || '未知错误'));
          btn.textContent = originalText;
          btn.disabled = false;
        }
      } catch (e) {
        alert('投递失败: ' + e.message);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    async function openJobDetail(jobId) {
      currentJobId = jobId;
      modalApplyBtn.textContent = '投递';
      modalApplyBtn.style.background = '';
      
      try {
        const res = await fetch('/api/v1/seeker/jobs/' + jobId, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success && data.data) {
          const job = data.data;
          modalTitle.textContent = job.title || '岗位详情';
          modalBody.innerHTML = '<div class="detail-row">' +
            '<div class="detail-label">公司名称</div>' +
            '<div class="detail-value">' + escapeHtml(job.companyName || '') + '</div>' +
            '</div>' +
            '<div class="detail-row">' +
            '<div class="detail-label">岗位类别</div>' +
            '<div class="detail-value">' + escapeHtml(job.categoryName || '') + '</div>' +
            '</div>' +
            (job.city ? '<div class="detail-row">' +
            '<div class="detail-label">工作城市</div>' +
            '<div class="detail-value">' + escapeHtml(job.city) + '</div>' +
            '</div>' : '') +
            (job.salaryMin || job.salaryMax ? '<div class="detail-row">' +
            '<div class="detail-label">薪资范围</div>' +
            '<div class="detail-value">' + (job.salaryMin ? (job.salaryMin / 1000) + 'K' : '') +
            (job.salaryMin && job.salaryMax ? ' - ' : '') +
            (job.salaryMax ? (job.salaryMax / 1000) + 'K' : '') + '/月</div>' +
            '</div>' : '') +
            (job.workType ? '<div class="detail-row">' +
            '<div class="detail-label">工作类型</div>' +
            '<div class="detail-value">' + escapeHtml(job.workType) + '</div>' +
            '</div>' : '') +
            '<div class="detail-row">' +
            '<div class="detail-label">岗位描述</div>' +
            '<div class="detail-desc">' + escapeHtml(job.description || '') + '</div>' +
            '</div>';
          jobModal.classList.add('active');
        } else {
          alert('获取岗位详情失败: ' + (data.message || '未知错误'));
        }
      } catch (e) {
        alert('获取岗位详情失败: ' + e.message);
      }
    }

    function closeJobModal() {
      jobModal.classList.remove('active');
      currentJobId = null;
    }

    async function applyFromModal() {
      if (!currentJobId) return;
      const btn = modalApplyBtn;
      const originalText = btn.textContent;
      btn.textContent = '投递中...';
      btn.disabled = true;
      
      try {
        const res = await fetch('/api/v1/seeker/jobs/' + currentJobId + '/apply', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (data.success) {
          btn.textContent = '已投递';
          btn.style.background = '#238636';
        } else {
          alert('投递失败: ' + (data.message || '未知错误'));
          btn.textContent = originalText;
          btn.disabled = false;
        }
      } catch (e) {
        alert('投递失败: ' + e.message);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    btnNew.onclick = createNewSession;
    sendBtn.onclick = sendMessage;
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    checkLoginStatus();
  </script>
</body>
</html>
