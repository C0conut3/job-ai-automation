<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>申请记录</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #58a6ff;
      --danger: #f85149;
      --ok: #3fb950;
      --warn: #d29922;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 1.75rem 1.25rem; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 1rem; }
    .nav { margin-bottom: 1.25rem; font-size: 0.9rem; }
    .nav a { color: var(--accent); text-decoration: none; margin-right: 0.5rem; }
    .nav a:hover { text-decoration: underline; }
    
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .tabs button { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .tabs button.active { background: var(--card); color: var(--text); border-color: var(--accent); }
    
    .panel { display: none; }
    .panel.active { display: block; }

    .record-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .record-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .record-title { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--accent); }
    .record-meta { font-size: 0.85rem; color: var(--muted); display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 0.15rem 0.4rem; border-radius: 4px; background: #30363d; color: var(--text); }
    .badge.submitted { background: rgba(88, 166, 255, 0.2); color: var(--accent); }
    .badge.invited { background: rgba(210, 153, 34, 0.2); color: var(--warn); }
    .badge.accepted { background: rgba(63, 185, 80, 0.2); color: var(--ok); }
    .badge.rejected { background: rgba(248, 81, 73, 0.2); color: var(--danger); }
    
    .msg { font-size: 0.85rem; color: var(--danger); margin-bottom: 1rem; }
    .loading { color: var(--muted); }
    .unauth-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 3rem 2rem; text-align: center;
    }
    .unauth-card h2 { margin: 0 0 1rem; color: var(--text); }
    .unauth-card p { color: var(--muted); margin: 0 0 2rem; }
    .unauth-card a { display: inline-block; padding: 0.6rem 1.5rem; border-radius: 6px; background: var(--accent); color: #0f1419; text-decoration: none; font-weight: 600; }
    .unauth-card a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="page-title">申请记录</h1>
    <p class="nav">
      <a href="/">返回首页</a>
    </p>
    <div id="msg" class="msg"></div>
    <div id="loading" class="loading">加载中...</div>

    <div id="content-area" style="display:none;">
      <div class="tabs">
        <button type="button" class="active" data-tab="tab-1" id="btn-tab-1">我的投递</button>
        <button type="button" data-tab="tab-2" id="btn-tab-2">我的邀请</button>
      </div>

      <div id="panel-tab-1" class="panel active"></div>
      <div id="panel-tab-2" class="panel"></div>
    </div>
  </div>

  <script>
    const loadingEl = document.getElementById('loading');
    const msgEl = document.getElementById('msg');
    const contentArea = document.getElementById('content-area');
    const panel1 = document.getElementById('panel-tab-1');
    const panel2 = document.getElementById('panel-tab-2');
    const btnTab1 = document.getElementById('btn-tab-1');
    const btnTab2 = document.getElementById('btn-tab-2');
    
    let activeRole = '';

    async function parseApi(res) {
      const text = await res.text();
      try { return JSON.parse(text); } catch { return { success: false, message: text || "请求失败" }; }
    }

    function esc(s) {
      if (s == null) return "";
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    const statusMap = {
      SUBMITTED: '已投递',
      INVITED: '已邀请',
      VIEWED: '被查看',
      ACCEPTED: '已录用',
      REJECTED: '不合适'
    };

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      };
    });

    function renderCards(records, type) {
      if (records.length === 0) {
        return '<p style="color:var(--muted);text-align:center;">暂无记录</p>';
      }
      return records.map(r => {
        const title = activeRole === 'SEEKER' ? r.jobTitle : r.seekerName;
        const subTitle = activeRole === 'SEEKER' ? r.companyName : `投递岗位：${r.jobTitle}`;
        const statusClass = r.status.toLowerCase();
        
        return `
          <div class="record-card">
            <div class="record-header">
              <h3 class="record-title">${esc(title)} <span class="badge ${statusClass}">${esc(statusMap[r.status] || r.status)}</span></h3>
            </div>
            <div class="record-meta">
              <span>${esc(subTitle)}</span>
              <span>更新时间: ${new Date(r.updatedAt).toLocaleString()}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadData() {
      try {
        const meRes = await fetch('/api/v1/auth/me', { credentials: "include" });
        const meData = await parseApi(meRes);
        
        if (!meData.success) {
          loadingEl.style.display = 'none';
          document.querySelector('.wrap').innerHTML += `
            <div class="unauth-card">
              <h2>需要登录</h2>
              <p>请先登录后查看申请记录</p>
              <a href="/login.html">前往登录 / 注册</a>
            </div>
          `;
          return;
        }

        activeRole = meData.data.activeRole;
        document.getElementById('page-title').textContent = activeRole === 'SEEKER' ? '申请记录 (求职者)' : '处理记录 (招聘者)';
        
        if (activeRole === 'SEEKER') {
          btnTab1.textContent = '我投递的';
          btnTab2.textContent = '我收到的邀请';
          
          const res = await fetch('/api/v1/application-records/seeker', { credentials: "include" });
          const data = await parseApi(res);
          if (data.success) {
            const applied = data.data.filter(r => r.status !== 'INVITED');
            const invited = data.data.filter(r => r.status === 'INVITED');
            panel1.innerHTML = renderCards(applied, 'applied');
            panel2.innerHTML = renderCards(invited, 'invited');
          }
        } else if (activeRole === 'RECRUITER') {
          btnTab1.textContent = '收到的投递';
          btnTab2.textContent = '发出的邀请';
          
          const res = await fetch('/api/v1/application-records/recruiter', { credentials: "include" });
          const data = await parseApi(res);
          if (data.success) {
            const applied = data.data.filter(r => r.status !== 'INVITED');
            const invited = data.data.filter(r => r.status === 'INVITED');
            panel1.innerHTML = renderCards(applied, 'applied');
            panel2.innerHTML = renderCards(invited, 'invited');
          }
        } else {
          msgEl.textContent = "当前身份无申请记录";
          loadingEl.style.display = 'none';
          return;
        }

        loadingEl.style.display = 'none';
        contentArea.style.display = 'block';

      } catch (err) {
        loadingEl.style.display = 'none';
        msgEl.textContent = "网络错误";
      }
    }

    loadData();
  </script>
</body>
</html>
